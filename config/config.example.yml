# Example omp config: copy to ~/.omp/agent/config.yml and adjust.
# Model roles pick a primary per role; fallbackChains are tried in order when the
# primary hits a usage limit. Keep one model per vendor in each chain so a single
# provider outage or quota can't take out the whole chain. Paid models only.
setupVersion: 2
modelRoles:
  default: anthropic/claude-sonnet-5-5
  task: anthropic/claude-sonnet-5-5
  slow: anthropic/claude-opus-5-5
  plan: anthropic/claude-opus-5-5
  smol: anthropic/claude-sonnet-5-5
  commit: anthropic/claude-sonnet-5-5
retry:
  modelFallback: true
  fallbackOn: usage-limit
  usageAwareFallback: true
  usageReservePct: 5
  usageReservePolicy: auto
  fallbackChains:
    default: &strong-fast
      - openai-codex/gpt-6.1-sol
      - cursor/grok-4.7
      - opencode-go/deepseek-v4.1-flash
      - cursor/muse-spark-1.3
    task: *strong-fast
    slow: &strong-deep
      - openai-codex/gpt-6.1-sol
      - cursor/grok-4.7
      - opencode-go/deepseek-v4-pro
      - cursor/muse-spark-1.3
    plan: *strong-deep
    smol: &cheap
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5
      - opencode-go/deepseek-v4.1-flash
      - cursor/gemini-3.8-flash
    commit: *cheap
task:
  isolation:
    enabled: true
    merge: patch
defaultThinkingLevel: auto
browser:
  enabled: false
